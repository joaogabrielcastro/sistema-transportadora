# Postgres para desenvolvimento (credenciais alinhadas ao backend/.env).
# Porta 5434 no host: evita 5432 (Postgres local) e 5433 (outros projetos, ex. Benny).
services:
  db:
    image: postgres:16-alpine
    container_name: transportadora_postgres_dev
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transportadora_dev
    volumes:
      - transportadora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transportadora_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opcional: fila durable local (REDIS_URL=redis://localhost:6379/0)
  redis:
    image: redis:7-alpine
    container_name: transportadora_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - transportadora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  transportadora_pgdata:
  transportadora_redisdata:
