# Stack local completo:
#   docker compose up --build
#
# Front:  http://localhost:8080
# API:    http://localhost:3020
# Postgres (host): localhost:5434
# Redis (host):    localhost:6379
#
# Só banco/redis (como antes):
#   docker compose up db redis
services:
  db:
    image: postgres:16-alpine
    container_name: transportadora_postgres_dev
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transportadora_dev
    volumes:
      - transportadora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transportadora_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transportadora_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - transportadora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transportadora_api_dev
    restart: unless-stopped
    ports:
      - "3020:3020"
    environment:
      NODE_ENV: production
      PORT: "3020"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/transportadora_dev
      DB_SSL_MODE: disable
      PRISMA_CLIENT_ENGINE_TYPE: library
      REDIS_URL: redis://redis:6379/0
      RUN_ORDEM_WORKER_IN_API: "false"
      AUTH_ENABLED: "true"
      JWT_SECRET: local-dev-jwt-secret-atrack
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:5174
      FRONTEND_URL: http://localhost:8080
      ADMIN_EMAIL: admin@abrotto.local
      ADMIN_PASSWORD: admin123456
      ADMIN_NOME: Administrador
      UPLOADS_DIR: /app/uploads
      BRASIL_NFE_AMBIENTE: "2"
      FISCAL_SECRETS_KEY: local-dev-fiscal-secrets-key-atrack
    volumes:
      - transportadora_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transportadora_worker_dev
    restart: unless-stopped
    command: ["node", "scripts/worker.mjs"]
    ports:
      - "3021:3021"
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: "3021"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/transportadora_dev
      DB_SSL_MODE: disable
      PRISMA_CLIENT_ENGINE_TYPE: library
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /app/uploads
    volumes:
      - transportadora_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3021/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3020
        VITE_AUTH_REQUIRED: "true"
    container_name: transportadora_web_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  transportadora_pgdata:
  transportadora_redisdata:
  transportadora_uploads:
